[package]
name = "school-bell"
version = "0.1.0"
description = "Local Windows years bell scheduler"
authors = ["Years Bell"]
edition = "2021"

[lib]
name = "school_bell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1.0.99"
chrono = "0.4.45"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3", "wav"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.11.0"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tokio = { version = "1.47.1", features = ["macros", "sync", "time"] }
uuid = { version = "1.18.0", features = ["v4", "serde"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
